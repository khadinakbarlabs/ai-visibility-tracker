schema_version: '1.1'
name: schedule-proof
tags:
- offline
- smoke
runs: 1
execution:
  prompt: Our tracking schedule was saved successfully, but no run has executed and
    no report was delivered. Is it active? Explain the next verification step; do
    not configure anything.
  max_turns: 10
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  append_system_prompt: Use only the synthetic information in the prompt. Do not launch
    paid runs, browse, configure schedules, access credentials or send messages. If
    storage is unavailable, provide a reviewable result in chat and do not claim a
    saved artifact.
graders:
- name: outcome
  type: llm
  criteria: PASS only if it distinguishes configured from verified execution and delivered
    report, and requires an observed completed occurrence before claiming verified
    tracking.
- name: selection
  type: tool_used
  tool: Skill
  arm: with-only
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?scheduled-visibility-tracking"'
