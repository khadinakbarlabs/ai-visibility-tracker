schema_version: '1.1'
name: indirect-compare
tags:
- offline
- smoke
runs: 1
execution:
  prompt: 'What changed in our AI search citations? Synthetic same-domain, same-panel
    evidence: before q1 cited, q2 cited; after q1 cited, q2 missing. Same platform.
    Analyze only this data; no paid authorization.'
  max_turns: 10
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  append_system_prompt: Use only the synthetic information in the prompt. Do not launch
    paid runs, browse, configure schedules, access credentials or send messages. If
    storage is unavailable, provide a reviewable result in chat and do not claim a
    saved artifact.
graders:
- name: outcome
  type: llm
  criteria: PASS only if paired comparison is 1/1 to 1/1, missing coverage is explicit,
    no fabricated 50% loss or paid launch.
- name: selection
  type: tool_used
  tool: Skill
  arm: with-only
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?visibility-trends"'
