schema_version: '1.1'
name: resume-review
tags:
- offline
- smoke
runs: 1
execution:
  prompt: 'Continue our example.com campaign using only this synthetic context: accepted
    goal is improve citations; action A was rejected for wrong audience, B is a draft;
    site other.example is paused; no new measurements or spending authorization.'
  max_turns: 10
  timeout_seconds: 120
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  append_system_prompt: Use only the synthetic information in the prompt. Do not launch
    paid runs, browse, configure schedules, access credentials or send messages. If
    storage is unavailable, provide a reviewable result in chat and do not claim a
    saved artifact.
graders:
- name: outcome
  type: llm
  criteria: PASS only if it resumes accepted goal without repeat onboarding, suppresses
    rejected A, keeps B a draft and other site paused, and gives one feasible next
    action without new collection.
- name: selection
  type: tool_used
  tool: Skill
  arm: with-only
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-growth-agent"'
